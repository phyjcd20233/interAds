<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美國國債計算器 | U.S. Treasury Bond Calculator</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <style>
    .bg-gray-100 { background-color: #f3f4f6; }
    .min-h-screen { min-height: 100vh; }
    .flex { display: flex; }
    .items-center { align-items: center; }
    .justify-center { justify-content: center; }
    .max-w-4xl { max-width: 42rem; }
    .mx-auto { margin-left: auto; margin-right: auto; }
    .p-6 { padding: 1.5rem; }
    .bg-white { background-color: #ffffff; }
    .rounded-lg { border-radius: 0.5rem; }
    .shadow-lg { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); }
    .text-2xl { font-size: 1.5rem; line-height: 2rem; }
    .font-bold { font-weight: 700; }
    .text-center { text-align: center; }
    .mb-6 { margin-bottom: 1.5rem; }
    .grid { display: grid; }
    .grid-cols-1 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
    .md\\:grid-cols-2 { @media (min-width: 768px) { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .gap-4 { gap: 1rem; }
    .block { display: block; }
    .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
    .font-medium { font-weight: 500; }
    .text-gray-700 { color: #374151; }
    .mt-1 { margin-top: 0.25rem; }
    .w-full { width: 100%; }
    .p-2 { padding: 0.5rem; }
    .border { border-width: 1px; border-color: #e5e7eb; }
    .rounded-md { border-radius: 0.375rem; }
    .text-gray-600 { color: #4b5563; }
    .text-red-500 { color: #ef4444; }
    .mt-4 { margin-bottom: 1rem; }
    .space-x-4 > :not(:last-child) { margin-right: 1rem; }
    .bg-blue-500 { background-color: #3b82f6; }
    .text-white { color: #ffffff; }
    .px-4 { padding-left: 1rem; padding-right: 1rem; }
    .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
    .hover\\:bg-blue-600:hover { background-color: #2563eb; }
    .bg-green-500 { background-color: #22c55e; }
    .hover\\:bg-green-600:hover { background-color: #16a34a; }
    .bg-gray-50 { background-color: #f9fafb; }
    .text-lg { font-size: 1.125rem; line-height: 1.75rem; }
    .font-semibold { font-weight: 600; }
    .list-disc { list-style-type: disc; }
    .pl-5 { padding-left: 1.25rem; }
    .bg-red-500 { background-color: #ef4444; }
    .hover\\:bg-red-600:hover { background-color: #dc2626; }
    .space-y-2 > :not(:last-child) { margin-bottom: 0.5rem; }
    .p-4 { padding: 1rem; }
    .shadow { box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06); }
    .mb-4 { margin-bottom: 1rem; }
    .overflow-x-auto { overflow-x: auto; }
    .border-gray-200 { border-color: #e5e7eb; }
    .text-left { text-align: left; }
    .bg-yellow-500 { background-color: #eab308; }
    .hover\\:bg-yellow-600:hover { background-color: #ca8a04; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div id="root"></div>
  <script>
    // 語言翻譯對象
    const translations = {
      zh: {
        title: '美國國債計算器',
        cusip: 'CUSIP 編號（以逗號分隔）',
        issueDate: '發行日期（以逗號分隔）',
        checkCusip: '檢查 CUSIP',
        buyPrice: '買入價格（每100美元面值）',
        buyDate: '買入日期',
        investmentAmount: '投資金額（美元）',
        couponRate: '票面利率（%）',
        paymentDates: '付息日期（以逗號分隔，例如 05-15,11-15）',
        sellDate: '賣出日期',
        sellPrice: '賣出價格（每100美元面值）',
        exchangeRate: '美元兌港元匯率（可選）',
        calculate: '計算',
        exportCSV: '匯出 CSV',
        clearHistory: '清除歷史記錄',
        results: '計算結果',
        faceValue: '面值',
        accruedInterest: '應計利息',
        netInterest: '淨利息收入',
        capitalGain: '資本利得',
        totalReturn: '總回報',
        returnPercentage: '回報百分比',
        hkdReturn: '港元回報（估算）',
        calculationSteps: '計算步驟',
        history: '歷史記錄',
        date: '日期',
        invalidCusip: '以下 CUSIP 或發行日期無效：',
        fillAllFields: '請填寫所有欄位，包括 CUSIP、發行日期和付息日期',
        invalidNumbers: '請輸入有效的價格、投資金額、票面利率或匯率',
        invalidDateFormat: '無效的日期格式',
        sellDateAfterBuy: '賣出日期必須晚於買入日期',
        taxNote: '提示：利息收入需繳美國聯邦所得稅，香港無本地稅。請諮詢稅務顧問。',
        language: 'English',
        cusipValid: '所有 CUSIP 和發行日期有效，請繼續輸入資料',
        cusipInvalid: '部分或全部 CUSIP 或發行日期無效，請檢查',
        networkError: '網路錯誤，無法連接到 TreasuryDirect，請手動輸入票面利率和付息日期',
        manualInput: '無法獲取以下 CUSIP 資料，請手動輸入票面利率和付息日期：',
        multipleCusips: '多 CUSIP 比較結果',
        renderError: '頁面渲染失敗，請檢查控制台錯誤或聯繫支持'
      },
      en: {
        title: 'U.S. Treasury Bond Calculator',
        cusip: 'CUSIP Number (comma-separated)',
        issueDate: 'Issue Date (comma-separated)',
        checkCusip: 'Check CUSIP',
        buyPrice: 'Buy Price (per $100 face value)',
        buyDate: 'Buy Date',
        investmentAmount: 'Investment Amount (USD)',
        couponRate: 'Coupon Rate (%)',
        paymentDates: 'Payment Dates (comma-separated, e.g., 05-15,11-15)',
        sellDate: 'Sell Date',
        sellPrice: 'Sell Price (per $100 face value)',
        exchangeRate: 'USD/HKD Exchange Rate (optional)',
        calculate: 'Calculate',
        exportCSV: 'Export to CSV',
        clearHistory: 'Clear History',
        results: 'Results',
        faceValue: 'Face Value',
        accruedInterest: 'Accrued Interest',
        netInterest: 'Net Interest Income',
        capitalGain: 'Capital Gain',
        totalReturn: 'Total Return',
        returnPercentage: 'Return Percentage',
        hkdReturn: 'HKD Return (estimated)',
        calculationSteps: 'Calculation Steps',
        history: 'Calculation History',
        date: 'Date',
        invalidCusip: 'The following CUSIP or issue date is invalid:',
        fillAllFields: 'Please fill in all fields, including CUSIP, issue date, and payment dates',
        invalidNumbers: 'Please enter valid numbers for prices, investment amount, coupon rate, or exchange rate',
        invalidDateFormat: 'Invalid date format',
        sellDateAfterBuy: 'Sell date must be after buy date',
        taxNote: 'Note: Interest income is subject to U.S. federal income tax; no local tax in Hong Kong. Consult a tax advisor.',
        language: '繁體中文',
        cusipValid: 'All CUSIP and issue dates are valid, please proceed with data entry',
        cusipInvalid: 'Some or all CUSIP or issue dates are invalid, please check',
        networkError: 'Network error, unable to connect to TreasuryDirect, please enter coupon rate and payment dates manually',
        manualInput: 'Unable to fetch data for the following CUSIP, please enter coupon rate and payment dates manually:',
        multipleCusips: 'Multiple CUSIP Comparison Results',
        renderError: 'Failed to render page, please check console errors or contact support'
      }
    };

    // 日期計算輔助函數
    const differenceInDays = (date1, date2) => {
      const oneDay = 24 * 60 * 60 * 1000;
      return Math.round(Math.abs((date1 - date2) / oneDay));
    };

    const formatDate = (date) => {
      if (!(date instanceof Date) || isNaN(date)) return 'Invalid Date';
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    // 錯誤邊界組件
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { error: null };
      }

      static getDerivedStateFromError(error) {
        return { error: error.message };
      }

      componentDidCatch(error, errorInfo) {
        console.error('ErrorBoundary caught:', error, errorInfo);
      }

      render() {
        if (this.state.error) {
          return React.createElement(
            'div',
            { className: 'text-red-500 text-center p-4' },
            translations[localStorage.getItem('language') || 'zh'].renderError
          );
        }
        return this.props.children;
      }
    }

    // BondCalculator 組件
    const BondCalculator = () => {
      const [language, setLanguage] = React.useState(localStorage.getItem('language') || 'zh');
      const [cusipInput, setCusipInput] = React.useState('91282CLW9');
      const [issueDateInput, setIssueDateInput] = React.useState('2024-11-15');
      const [paymentDatesInput, setPaymentDatesInput] = React.useState('05-15,11-15');
      const [buyPrice, setBuyPrice] = React.useState('');
      const [buyDate, setBuyDate] = React.useState('');
      const [investmentAmount, setInvestmentAmount] = React.useState('');
      const [couponRate, setCouponRate] = React.useState('');
      const [sellDate, setSellDate] = React.useState('');
      const [sellPrice, setSellPrice] = React.useState('');
      const [exchangeRate, setExchangeRate] = React.useState('');
      const [results, setResults] = React.useState([]);
      const [error, setError] = React.useState('');
      const [history, setHistory] = React.useState(JSON.parse(localStorage.getItem('calcHistory')) || []);
      const [bondDataList, setBondDataList] = React.useState([]);
      const [isCusipValid, setIsCusipValid] = React.useState(false);
      const [isManualInput, setIsManualInput] = React.useState(true); // 預設啟用手動輸入
      const [invalidCusips, setInvalidCusips] = React.useState([]);

      // 語言切換
      const toggleLanguage = () => {
        const newLang = language === 'zh' ? 'en' : 'zh';
        setLanguage(newLang);
        localStorage.setItem('language', newLang);
        console.log('Language toggled to:', newLang);
      };

      // 檢查多個 CUSIP 和發行日期
      const checkCusip = async () => {
        setError('');
        setBondDataList([]);
        setIsCusipValid(false);
        setIsManualInput(true); // 強制手動輸入作為後備
        setInvalidCusips([]);
        console.log('Checking CUSIPs:', cusipInput, 'Issue Dates:', issueDateInput, 'Payment Dates:', paymentDatesInput);

        if (!cusipInput || !issueDateInput || !paymentDatesInput) {
          setError(translations[language].fillAllFields);
          console.error('Missing CUSIP, issue date, or payment dates input');
          return;
        }

        const cusips = cusipInput.split(',').map(c => c.trim()).filter(c => c);
        const issueDates = issueDateInput.split(',').map(d => d.trim()).filter(d => d);
        const paymentDatesList = paymentDatesInput.split(',').map(d => d.trim()).filter(d => d);

        if (cusips.length !== issueDates.length || cusips.length === 0) {
          setError(translations[language].fillAllFields);
          console.error('CUSIP and issue date arrays length mismatch or empty:', cusips.length, issueDates.length);
          return;
        }

        const bondDataResults = [];
        const invalid = [];

        // 嘗試 API 請求
        for (let i = 0; i < cusips.length; i++) {
          const cusip = cusips[i];
          const issueDate = issueDates[i];

          console.log(`Fetching data for CUSIP: ${cusip}, Issue Date: ${issueDate}`);
          try {
            const response = await fetch(
              `https://www.treasurydirect.gov/TA_WS/securities/search?cusip=${encodeURIComponent(cusip)}&issueDate=${encodeURIComponent(issueDate)}&format=json`
            );
            if (!response.ok) {
              invalid.push({ cusip, issueDate, reason: `HTTP ${response.status}` });
              console.warn(`HTTP error for ${cusip}: ${response.status}`);
              continue;
            }
            const data = await response.json();
            if (data && Array.isArray(data) && data.length > 0) {
              bondDataResults.push({
                cusip,
                issueDate,
                couponRate: parseFloat(data[0].interestRate) || 0,
                maturityDate: data[0].maturityDate || 'N/A',
                paymentDates: data[0].firstInterestPayment ? [data[0].firstInterestPayment.split('-').slice(1).join('-')] : paymentDatesList
              });
              console.log(`Success for ${cusip}:`, data[0]);
            } else {
              invalid.push({ cusip, issueDate, reason: 'Invalid CUSIP or issue date' });
              console.warn(`No data returned for ${cusip}`);
            }
          } catch (err) {
            invalid.push({ cusip, issueDate, reason: 'Network error' });
            console.error(`Network error for ${cusip}:`, err.message);
          }
        }

        setBondDataList(bondDataResults);
        setInvalidCusips(invalid);

        if (invalid.length > 0 || bondDataResults.length === 0) {
          setError(`${translations[language].networkError}`);
          setIsManualInput(true);
          setIsCusipValid(true); // 允許手動輸入
          console.warn('API unavailable, switching to manual input:', invalid);
          // 使用手動輸入的付息日期
          const manualBondData = cusips.map((cusip, i) => ({
            cusip,
            issueDate: issueDates[i],
            couponRate: 0, // 等待用戶輸入
            paymentDates: paymentDatesList
          }));
          setBondDataList(manualBondData);
        } else {
          setIsCusipValid(true);
          setError(translations[language].cusipValid);
          console.log('All CUSIPs valid:', bondDataResults);
        }
      };

      // 計算應計利息、淨利息和資本利得
      const calculateReturns = () => {
        setError('');
        setResults([]);
        console.log('Calculating returns...');

        try {
          if (!isCusipValid) {
            throw new Error(translations[language].cusipInvalid);
          }
          if (!buyPrice || !buyDate || !investmentAmount || !couponRate || !sellDate || !sellPrice || !paymentDatesInput) {
            throw new Error(translations[language].fillAllFields);
          }
          const buyPriceNum = parseFloat(buyPrice);
          const investmentAmountNum = parseFloat(investmentAmount);
          const couponRateNum = parseFloat(couponRate);
          const sellPriceNum = parseFloat(sellPrice);
          const exchangeRateNum = exchangeRate ? parseFloat(exchangeRate) : null;
          if (
            isNaN(buyPriceNum) ||
            isNaN(investmentAmountNum) ||
            isNaN(couponRateNum) ||
            isNaN(sellPriceNum) ||
            (exchangeRate && isNaN(exchangeRateNum))
          ) {
            throw new Error(translations[language].invalidNumbers);
          }
          const buyDateObj = new Date(buyDate);
          const sellDateObj = new Date(sellDate);
          if (isNaN(buyDateObj) || isNaN(sellDateObj)) {
            throw new Error(translations[language].invalidDateFormat);
          }
          if (buyDateObj >= sellDateObj) {
            throw new Error(translations[language].sellDateAfterBuy);
          }

          const resultsArray = [];
          const cusipsToProcess = bondDataList.length > 0
            ? bondDataList
            : cusipInput.split(',').map((cusip, i) => ({
                cusip: cusip.trim(),
                issueDate: issueDateInput.split(',')[i].trim(),
                couponRate: couponRateNum,
                paymentDates: paymentDatesInput.split(',').map(d => d.trim())
              }));

          console.log('Processing CUSIPs:', cusipsToProcess);

          for (const bondData of cusipsToProcess) {
            try {
              const faceValue = investmentAmountNum / (buyPriceNum / 100);
              console.log(`Face Value for ${bondData.cusip}: ${faceValue}`);

              const lastPaymentDate = getLastPaymentDate(buyDateObj, bondData.paymentDates);
              const daysAccrued = differenceInDays(buyDateObj, lastPaymentDate);
              const semiAnnualCoupon = (bondData.couponRate / 100) * faceValue / 2;
              const accruedInterest = (semiAnnualCoupon / 180) * daysAccrued;
              console.log(`Accrued Interest for ${bondData.cusip}: ${accruedInterest}, Days: ${daysAccrued}`);

              const paymentDates = getPaymentDatesBetween(buyDateObj, sellDateObj, bondData.paymentDates);
              const totalInterestReceived = semiAnnualCoupon * paymentDates.length;
              console.log(`Payment Dates for ${bondData.cusip}:`, paymentDates, `Total Interest: ${totalInterestReceived}`);

              const netInterest = totalInterestReceived - accruedInterest;
              const capitalGain = (sellPriceNum - buyPriceNum) * (faceValue / 100);
              const totalReturn = netInterest + capitalGain;
              const returnPercentage = (totalReturn / investmentAmountNum) * 100;
              const hkdReturn = exchangeRateNum ? (totalReturn * exchangeRateNum).toFixed(2) : null;

              const steps = [
                `1. ${language === 'zh' ? '面值 = 投資金額 ÷ (買入價格 ÷ 100)' : 'Face Value = Investment Amount ÷ (Buy Price ÷ 100)'} = ${investmentAmountNum} ÷ (${buyPriceNum} ÷ 100) = ${faceValue.toFixed(2)} USD`,
                `2. ${language === 'zh' ? '半年票息 = (票面利率 ÷ 100) × 面值 ÷ 2' : 'Semi-Annual Coupon = (Coupon Rate ÷ 100) × Face Value ÷ 2'} = (${bondData.couponRate} ÷ 100) × ${faceValue.toFixed(2)} ÷ 2 = ${semiAnnualCoupon.toFixed(2)} USD`,
                `3. ${language === 'zh' ? '應計利息天數 = 從' : 'Accrued Interest Days = Days from'} ${formatDate(lastPaymentDate)} ${language === 'zh' ? '到' : 'to'} ${buyDate} = ${daysAccrued} ${language === 'zh' ? '天' : 'days'}`,
                `4. ${language === 'zh' ? '應計利息 = (半年票息 ÷ 180) × 應計天數' : 'Accrued Interest = (Semi-Annual Coupon ÷ 180) × Accrued Days'} = (${semiAnnualCoupon.toFixed(2)} ÷ 180) × ${daysAccrued} = ${accruedInterest.toFixed(2)} USD`,
                `5. ${language === 'zh' ? '收到的利息支付 = 半年票息 × 付息次數' : 'Interest Payments Received = Semi-Annual Coupon × Number of Payments'} (${paymentDates.length}) = ${semiAnnualCoupon.toFixed(2)} × ${paymentDates.length} = ${totalInterestReceived.toFixed(2)} USD`,
                `6. ${language === 'zh' ? '淨利息 = 收到的利息 - 應計利息' : 'Net Interest = Total Interest Received - Accrued Interest'} = ${totalInterestReceived.toFixed(2)} - ${accruedInterest.toFixed(2)} = ${netInterest.toFixed(2)} USD`,
                `7. ${language === 'zh' ? '資本利得 = (賣出價格 - 買入價格) × (面值 ÷ 100)' : 'Capital Gain = (Sell Price - Buy Price) × (Face Value ÷ 100)'} = (${sellPriceNum} - ${buyPriceNum}) × (${faceValue.toFixed(2)} ÷ 100) = ${capitalGain.toFixed(2)} USD`,
                `8. ${language === 'zh' ? '總回報 = 淨利息 + 資本利得' : 'Total Return = Net Interest + Capital Gain'} = ${netInterest.toFixed(2)} + ${capitalGain.toFixed(2)} = ${totalReturn.toFixed(2)} USD`,
                `9. ${language === 'zh' ? '回報百分比 = (總回報 ÷ 投資金額) × 100' : 'Return Percentage = (Total Return ÷ Investment Amount) × 100'} = (${totalReturn.toFixed(2)} ÷ ${investmentAmountNum}) × 100 = ${returnPercentage.toFixed(2)}%`
              ];

              const result = {
                cusip: bondData.cusip,
                issueDate: bondData.issueDate,
                faceValue: faceValue.toFixed(2),
                accruedInterest: accruedInterest.toFixed(2),
                netInterest: netInterest.toFixed(2),
                capitalGain: capitalGain.toFixed(2),
                totalReturn: totalReturn.toFixed(2),
                returnPercentage: returnPercentage.toFixed(2),
                hkdReturn,
                steps
              };
              resultsArray.push(result);

              setHistory(prev => {
                const newHistory = [...prev, { ...result, buyDate, sellDate, timestamp: new Date().toISOString() }];
                localStorage.setItem('calcHistory', JSON.stringify(newHistory));
                return newHistory;
              });
            } catch (err) {
              console.error(`Calculation error for ${bondData.cusip}:`, err.message);
              setError(`Calculation failed for ${bondData.cusip}: ${err.message}`);
            }
          }

          setResults(resultsArray);
          console.log('Calculation results:', resultsArray);
        } catch (err) {
          setError(err.message);
          console.error('Calculation Error:', err.message);
        }
      };

      // 獲取上一個付息日期
      const getLastPaymentDate = (buyDate, paymentDates) => {
        try {
          const buyYear = buyDate.getFullYear();
          const dates = paymentDates.map(date => {
            const [month, day] = date.split('-');
            return new Date(buyYear, month - 1, day);
          }).filter(date => date <= buyDate && !isNaN(date));
          if (dates.length === 0) {
            const issueDateObj = new Date(bondDataList[0]?.issueDate || issueDateInput.split(',')[0].trim());
            console.log('Using issue date as fallback:', issueDateObj);
            return issueDateObj;
          }
          return dates[dates.length - 1];
        } catch (err) {
          console.error('Error in getLastPaymentDate:', err.message);
          return new Date(bondDataList[0]?.issueDate || issueDateInput.split(',')[0].trim());
        }
      };

      // 獲取買入到賣出之間的付息日期
      const getPaymentDatesBetween = (buyDate, sellDate, paymentDates) => {
        try {
          const dates = [];
          let currentYear = buyDate.getFullYear();
          const endYear = sellDate.getFullYear();
          while (currentYear <= endYear) {
            paymentDates.forEach(date => {
              const [month, day] = date.split('-');
              const paymentDate = new Date(currentYear, month - 1, day);
              if (paymentDate > buyDate && paymentDate <= sellDate && !isNaN(paymentDate)) {
                dates.push(paymentDate);
              }
            });
            currentYear++;
          }
          return dates;
        } catch (err) {
          console.error('Error in getPaymentDatesBetween:', err.message);
          return [];
        }
      };

      // 匯出 CSV
      const exportToCSV = () => {
        if (results.length === 0) {
          console.warn('No results to export');
          return;
        }
        try {
          const csvContent = [
            `${translations[language].cusip},${translations[language].issueDate},${translations[language].faceValue},${translations[language].accruedInterest},${translations[language].netInterest},${translations[language].capitalGain},${translations[language].totalReturn},${translations[language].returnPercentage},${translations[language].buyDate},${translations[language].sellDate}${language === 'zh' ? `,${translations[language].hkdReturn}` : ''}`,
            ...results.map(result =>
              `${result.cusip},${result.issueDate},${result.faceValue},${result.accruedInterest},${result.netInterest},${result.capitalGain},${result.totalReturn},${result.returnPercentage}%,${buyDate},${sellDate}${result.hkdReturn ? `,${result.hkdReturn}` : ''}`
            )
          ].join('\n');
          const blob = new Blob([csvContent], { type: 'text/csv' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `bond_calculation_${new Date().toISOString()}.csv`;
          a.click();
          URL.revokeObjectURL(url);
          console.log('CSV exported successfully');
